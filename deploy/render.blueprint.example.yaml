# TARGET example only. Connect/rename only after explicit environment approval.
services:
  - type: web
    name: fm-control-center-preview
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: FMCC_PROCESS_ROLE
        value: operation
      # So necessario no modo sincrono (FMCC_CORE_QUERY_MODE=sync); no modo assincrono a operacao nao fala com a IA.
      - key: FMCC_AI_SERVICE_URL
        sync: false
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: FMCC_COGNITIVE_MODEL_BASE_URL
        sync: false
      - key: FMCC_COGNITIVE_MODEL_API_KEY
        sync: false
      - key: FMCC_COGNITIVE_MODEL_ID
        sync: false
  # TARGET (ADR-016): processo de IA separado da operacao. Nao conectar sem aprovacao.
  - type: web
    name: fm-command-ai-preview
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FMCC_PROCESS_ROLE
        value: ai
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: FMCC_COGNITIVE_MODEL_BASE_URL
        sync: false
      - key: FMCC_COGNITIVE_MODEL_API_KEY
        sync: false
      - key: FMCC_COGNITIVE_MODEL_ID
        sync: false
